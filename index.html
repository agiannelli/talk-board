<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Talk Board</title>
<meta name="description" content="A simple, kid-friendly AAC talk board.">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F6EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161C16" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Talk Board">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
  /* ---------- tokens ---------- */
  :root{
    color-scheme:light;
    --bg:#F2F6EF;
    --surface:#FFFFFF;
    --surface-alt:#E7EFE2;
    --ink:#213022;
    --ink-dim:#5C6B5A;
    --border:#D7E1D1;
    --accent:#2C7A6B;
    --accent-ink:#FFFFFF;
    --danger:#C24C3D;
    --shadow: 0 1px 2px rgba(33,48,34,.06), 0 6px 16px rgba(33,48,34,.08);

    --pronoun-bg:#FDE7A6;  --pronoun-fg:#4A3A0A;
    --verb-bg:#BCE3C2;     --verb-fg:#173821;
    --descriptor-bg:#BBD8F1; --descriptor-fg:#132E4A;
    --social-bg:#F4BADD;   --social-fg:#4A1236;
    --question-bg:#CBB8EC; --question-fg:#2E1B4A;
    --negation-bg:#F0A79C; --negation-fg:#4A1610;

    --cat-orange-bg:#F6C79C; --cat-orange-fg:#4A2A08;
    --cat-violet-bg:#CBB8EC; --cat-violet-fg:#2E1B4A;
    --cat-pink-bg:#F4B9C9;   --cat-pink-fg:#4A1420;
    --cat-teal-bg:#A6DAD3;   --cat-teal-fg:#0F3A34;
    --cat-tan-bg:#E2C69E;    --cat-tan-fg:#3E2A0C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#161C16;
      --surface:#1E261E;
      --surface-alt:#242E23;
      --ink:#EAF0E6;
      --ink-dim:#A9B8A5;
      --border:#33402F;
      --accent:#5FC1AC;
      --accent-ink:#0E1F1B;
      --danger:#F0A79C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);

      --pronoun-bg:#5C4A15;  --pronoun-fg:#FDE7A6;
      --verb-bg:#245234;     --verb-fg:#BCE3C2;
      --descriptor-bg:#1E3F5C; --descriptor-fg:#BBD8F1;
      --social-bg:#5C2647;   --social-fg:#F4BADD;
      --question-bg:#3B2A5C; --question-fg:#CBB8EC;
      --negation-bg:#5C2A22; --negation-fg:#F0A79C;

      --cat-orange-bg:#5C3A16; --cat-orange-fg:#F6C79C;
      --cat-violet-bg:#3B2A5C; --cat-violet-fg:#CBB8EC;
      --cat-pink-bg:#5C2438;   --cat-pink-fg:#F4B9C9;
      --cat-teal-bg:#1C4A43;   --cat-teal-fg:#A6DAD3;
      --cat-tan-bg:#4A3A1C;    --cat-tan-fg:#E2C69E;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#161C16; --surface:#1E261E; --surface-alt:#242E23; --ink:#EAF0E6; --ink-dim:#A9B8A5;
    --border:#33402F; --accent:#5FC1AC; --accent-ink:#0E1F1B; --danger:#F0A79C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
    --pronoun-bg:#5C4A15; --pronoun-fg:#FDE7A6; --verb-bg:#245234; --verb-fg:#BCE3C2;
    --descriptor-bg:#1E3F5C; --descriptor-fg:#BBD8F1; --social-bg:#5C2647; --social-fg:#F4BADD;
    --question-bg:#3B2A5C; --question-fg:#CBB8EC; --negation-bg:#5C2A22; --negation-fg:#F0A79C;
    --cat-orange-bg:#5C3A16; --cat-orange-fg:#F6C79C; --cat-violet-bg:#3B2A5C; --cat-violet-fg:#CBB8EC;
    --cat-pink-bg:#5C2438; --cat-pink-fg:#F4B9C9; --cat-teal-bg:#1C4A43; --cat-teal-fg:#A6DAD3;
    --cat-tan-bg:#4A3A1C; --cat-tan-fg:#E2C69E;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Atkinson Hyperlegible', ui-sans-serif, system-ui, sans-serif;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    display:flex; flex-direction:column; height:100vh; height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3{font-family:'Baloo 2', ui-rounded, system-ui, sans-serif; margin:0;}
  button{font-family:inherit;}
  .word-label{font-family:'Baloo 2', ui-rounded, system-ui, sans-serif;}
  [hidden]{display:none !important;}

  /* ---------- top bar: sentence strip ---------- */
  #sentenceBar{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; background:var(--surface); border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  #strip{
    flex:1; display:flex; align-items:center; gap:8px; overflow-x:auto;
    min-height:56px; padding:4px 2px; scroll-behavior:smooth;
  }
  #strip:empty::after{
    content:"Tap a word to start talking";
    color:var(--ink-dim); font-size:15px; padding-left:6px;
  }
  .chip{
    display:flex; align-items:center; gap:6px; background:var(--surface-alt);
    border:1px solid var(--border); border-radius:999px; padding:6px 12px;
    font-size:18px; white-space:nowrap; flex-shrink:0;
  }
  .chip .em{font-size:20px;}
  .iconbtn{
    display:flex; align-items:center; justify-content:center;
    width:52px; height:52px; border-radius:16px; border:none; cursor:pointer;
    flex-shrink:0; transition:transform .08s ease;
  }
  .iconbtn:active{transform:scale(.92);}
  #speakBtn{background:var(--accent); color:var(--accent-ink); font-size:24px;}
  #clearBtn{background:var(--surface-alt); color:var(--ink); font-size:20px; border:1px solid var(--border);}

  /* ---------- category tabs ---------- */
  #tabs{
    display:flex; gap:8px; padding:10px 12px; overflow-x:auto;
    background:var(--bg); flex-shrink:0; border-bottom:1px solid var(--border);
  }
  .tab{
    display:flex; align-items:center; gap:7px; padding:9px 16px;
    border-radius:14px; border:2px solid var(--border); background:var(--surface);
    color:var(--ink); font-size:16px; font-weight:600; white-space:nowrap; cursor:pointer;
    flex-shrink:0;
  }
  .tab.active{border-color:var(--accent); background:var(--accent); color:var(--accent-ink);}
  .tab .em{font-size:19px;}
  .tab.addTab{border-style:dashed; color:var(--ink-dim); font-weight:700;}

  /* ---------- grid ---------- */
  #gridWrap{flex:1; overflow-y:auto; padding:14px;}
  #grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(108px,1fr));
    gap:12px; align-content:start;
  }
  .tile{
    position:relative; aspect-ratio:1/1; border-radius:20px; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    padding:8px 6px; box-shadow:var(--shadow); transition:transform .08s ease;
  }
  .tile:active{transform:scale(.94);}
  .tile .em{font-size:38px; line-height:1;}
  .tile .word-label{font-size:15px; font-weight:700; text-align:center; line-height:1.15;}

  /* Bigger UI on tablets (iPad portrait ~768px and up). */
  @media (min-width:700px){
    #gridWrap{padding:20px;}
    #grid{grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:16px;}
    .tile .em{font-size:54px;}
    .tile .word-label{font-size:18px;}
    /* sentence strip */
    #sentenceBar{padding:12px 16px; gap:12px;}
    #strip{min-height:66px; gap:10px;}
    #strip:empty::after{font-size:17px;}
    .chip{font-size:21px; padding:8px 15px; gap:8px;}
    .chip .em{font-size:24px;}
    .iconbtn{width:60px; height:60px; border-radius:18px;}
    #speakBtn{font-size:28px;}
    #clearBtn{font-size:23px;}
    /* category tabs */
    #tabs{gap:10px; padding:12px 16px;}
    .tab{font-size:19px; padding:11px 20px; gap:9px;}
    .tab .em{font-size:23px;}
  }
  /* Larger still on iPad landscape / iPad Pro. */
  @media (min-width:1000px){
    #grid{grid-template-columns:repeat(auto-fill, minmax(186px,1fr)); gap:20px;}
    .tile{border-radius:24px;}
    .tile .em{font-size:66px;}
    .tile .word-label{font-size:21px;}
    #strip{min-height:74px;}
    .chip{font-size:23px; padding:9px 17px;}
    .chip .em{font-size:27px;}
    .iconbtn{width:66px; height:66px; border-radius:20px;}
    #speakBtn{font-size:32px;}
    #clearBtn{font-size:26px;}
    .tab{font-size:21px; padding:12px 22px;}
    .tab .em{font-size:25px;}
  }

  .tile-pronoun{background:var(--pronoun-bg); color:var(--pronoun-fg);}
  .tile-verb{background:var(--verb-bg); color:var(--verb-fg);}
  .tile-descriptor{background:var(--descriptor-bg); color:var(--descriptor-fg);}
  .tile-social{background:var(--social-bg); color:var(--social-fg);}
  .tile-question{background:var(--question-bg); color:var(--question-fg);}
  .tile-negation{background:var(--negation-bg); color:var(--negation-fg);}
  .tile-cat-orange{background:var(--cat-orange-bg); color:var(--cat-orange-fg);}
  .tile-cat-violet{background:var(--cat-violet-bg); color:var(--cat-violet-fg);}
  .tile-cat-pink{background:var(--cat-pink-bg); color:var(--cat-pink-fg);}
  .tile-cat-teal{background:var(--cat-teal-bg); color:var(--cat-teal-fg);}
  .tile-cat-tan{background:var(--cat-tan-bg); color:var(--cat-tan-fg);}

  .addTile{
    background:transparent; border:2px dashed var(--border); color:var(--ink-dim);
    font-size:15px; font-weight:700;
  }

  /* edit affordances on tiles */
  .tileEditRow{position:absolute; top:6px; right:6px; display:flex; gap:4px;}
  .miniBtn{
    width:28px; height:28px; border-radius:9px; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:14px;
    background:rgba(255,255,255,.85); color:#222; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .miniBtn.del{background:var(--danger); color:#fff;}
  .moveCol{position:absolute; left:4px; top:4px; bottom:4px; display:flex; flex-direction:column; justify-content:space-between;}
  .confirmRow{position:absolute; inset:0; background:rgba(0,0,0,.55); border-radius:20px; display:flex; align-items:center; justify-content:center; gap:8px;}
  .confirmRow button{border:none; border-radius:10px; padding:6px 10px; font-weight:700; font-size:13px; cursor:pointer;}
  .confirmRow .yes{background:var(--danger); color:#fff;}
  .confirmRow .no{background:#fff; color:#222;}

  /* ---------- footer / lock ---------- */
  #footer{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 14px; background:var(--surface); border-top:1px solid var(--border); flex-shrink:0;
  }
  #footLeft{display:flex; align-items:center; gap:8px; min-width:0;}
  #syncStatus{font-size:12px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; min-width:0;}
  #syncStatus span:last-child{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #syncDot{width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0;}
  #syncDot.off{background:var(--ink-dim);}
  #boardCodeChip{
    display:inline-flex; align-items:center; gap:5px; flex-shrink:0; cursor:pointer;
    background:var(--surface-alt); color:var(--ink); border:1px solid var(--border);
    border-radius:999px; padding:5px 11px; font-size:12px; font-weight:700; letter-spacing:.02em;
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #boardCodeChip[hidden]{display:none;}
  #boardCodeChip .lock{font-size:11px;}
  #footRight{display:flex; align-items:center; gap:8px;}
  #installBtn{
    display:none; align-items:center; gap:6px; background:var(--surface-alt); color:var(--ink);
    border:1px solid var(--border); border-radius:12px; padding:9px 14px; font-weight:700; font-size:14px; cursor:pointer;
  }
  #gearBtn{
    width:44px; height:44px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface-alt); color:var(--ink-dim); font-size:19px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .editTools{display:none; align-items:center; gap:8px;}
  body.editing .editTools{display:flex;}
  .editBtn{
    display:flex; align-items:center; gap:6px; background:var(--surface-alt); color:var(--ink);
    border:1px solid var(--border); border-radius:12px; padding:9px 14px; font-weight:700; font-size:14px; cursor:pointer;
  }
  #exitEditPill{
    display:none; align-items:center; gap:8px; background:var(--accent); color:var(--accent-ink);
    border:none; border-radius:999px; padding:9px 16px; font-weight:700; font-size:14px; cursor:pointer;
  }
  body.editing #exitEditPill{display:flex;}
  body.editing #gearBtn{display:none;}
  body.editing #installBtn{display:none !important;}

  /* ---------- modal ---------- */
  #modalRoot{position:fixed; inset:0; z-index:50; display:none; align-items:flex-end; justify-content:center;}
  #modalRoot.show{display:flex;}
  #modalBackdrop{position:absolute; inset:0; background:rgba(20,26,18,.5);}
  .sheet{
    position:relative; width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
    background:var(--surface); border-radius:22px 22px 0 0; padding:20px 20px 28px;
    box-shadow:0 -8px 30px rgba(0,0,0,.3);
  }
  @media (min-width:640px){
    #modalRoot{align-items:center;}
    .sheet{border-radius:22px; margin-bottom:0;}
  }
  .sheet h2{font-size:20px; margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:700; color:var(--ink-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
  .field input[type=text], .field select{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--bg); color:var(--ink); font-size:17px;
  }
  .emojiPicker{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .emojiPicker button{
    width:40px; height:40px; font-size:20px; border-radius:10px; border:1.5px solid var(--border);
    background:var(--bg); cursor:pointer;
  }
  .colorPicker{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .colorSwatch{width:38px; height:38px; border-radius:11px; border:2px solid transparent; cursor:pointer;}
  .colorSwatch.selected{border-color:var(--ink);}
  .sheetActions{display:flex; gap:10px; margin-top:18px;}
  .btn{flex:1; padding:13px; border-radius:13px; border:none; font-size:16px; font-weight:700; cursor:pointer;}
  .btnPrimary{background:var(--accent); color:var(--accent-ink);}
  .btnGhost{background:var(--surface-alt); color:var(--ink);}
  .tip{font-size:13px; color:var(--ink-dim); background:var(--surface-alt); border-radius:12px; padding:10px 12px; margin-bottom:14px; line-height:1.4;}
  .rowBtn{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--bg); border:1.5px solid var(--border); border-radius:14px;
    padding:14px; font-size:16px; font-weight:700; color:var(--ink); cursor:pointer; margin-bottom:10px;
  }
  .rowBtn .rb-em{font-size:22px;}
  .rowBtn small{display:block; font-weight:400; color:var(--ink-dim); font-size:13px; margin-top:2px;}

  /* ---------- unlock overlay ---------- */
  #unlockRoot{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(20,26,18,.55);}
  #unlockRoot.show{display:flex;}
  .unlockCard{background:var(--surface); border-radius:22px; padding:26px; width:min(320px,86vw); text-align:center;}
  .unlockRing{width:84px; height:84px; margin:0 auto 14px; position:relative;}
  .unlockRing svg{width:84px; height:84px; transform:rotate(-90deg);}
  .unlockRing circle{fill:none; stroke-width:8;}
  .unlockRing .track{stroke:var(--border);}
  .unlockRing .fill{stroke:var(--accent); stroke-dasharray:226; stroke-dashoffset:226; stroke-linecap:round;}
  .unlockRing .glyph{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:26px;}

  ::-webkit-scrollbar{width:0; height:0;}

  #toast{
    position:fixed; left:50%; bottom:calc(78px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:14px; font-weight:700;
    box-shadow:0 6px 20px rgba(0,0,0,.35); opacity:0; transition:opacity .2s ease; pointer-events:none; z-index:80; max-width:90vw; text-align:center;
  }
  #toast.show{opacity:1;}
</style>
</head>
<body>

<div id="sentenceBar">
  <div id="strip"></div>
  <button id="clearBtn" class="iconbtn" aria-label="Clear sentence">✕</button>
  <button id="speakBtn" class="iconbtn" aria-label="Speak sentence">🔊</button>
</div>

<div id="tabs"></div>

<div id="gridWrap"><div id="grid"></div></div>

<div id="footer">
  <div id="footLeft">
    <div id="syncStatus"><span id="syncDot"></span><span id="syncText">Loading…</span></div>
    <button id="boardCodeChip" type="button" title="Tap to copy your board code" hidden></button>
  </div>
  <div id="footRight">
    <button id="installBtn">⬇️ Install app</button>
    <div class="editTools">
      <button id="cloudBtn" class="editBtn">☁️ Cloud sync</button>
      <button id="backupBtn" class="editBtn">⬆️ Back up</button>
      <button id="restoreBtn" class="editBtn">⬇️ Restore</button>
    </div>
    <button id="exitEditPill">✓ Done editing</button>
    <button id="gearBtn" aria-label="Parent settings">⚙️</button>
  </div>
</div>

<input id="restoreFile" type="file" accept="application/json,.json" hidden>

<div id="unlockRoot">
  <div class="unlockCard">
    <div class="unlockRing">
      <svg viewBox="0 0 84 84">
        <circle class="track" cx="42" cy="42" r="36"></circle>
        <circle id="unlockFill" class="fill" cx="42" cy="42" r="36"></circle>
      </svg>
      <div class="glyph">🔒</div>
    </div>
    <h3 style="font-size:17px;margin-bottom:6px;">Parent controls</h3>
    <p style="font-size:14px;color:var(--ink-dim);margin:0 0 16px;">Press and hold the button for 1 second to edit words.</p>
    <button id="unlockHold" class="btn btnPrimary" style="width:100%;">Hold to unlock</button>
    <button id="unlockCancel" class="btn btnGhost" style="width:100%;margin-top:8px;">Cancel</button>
  </div>
</div>

<div id="modalRoot">
  <div id="modalBackdrop"></div>
  <div class="sheet" id="sheetContent"></div>
</div>

<div id="toast"></div>

<!-- Firebase (compat SDK) for optional cross-device cloud sync. Loaded with
     `defer` from Google's CDN so it never blocks the board; if it's blocked or
     the device is offline on first load, the app simply stays local-only. -->
<script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "talkboard.state.v1";
  var SCHEMA = 1;

  /* ---------------- cloud sync config (optional) ----------------
     Paste your Firebase web-app config below to turn on cross-device sync.
     Leave the values blank and the app stays local-only — it behaves exactly
     the same, just without the cloud. Full setup steps are in README.md. */
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyAcvlC5pKBFVZUnajB7WOvQlDS3b5UtQIk",
    authDomain: "talk-board-f5dca.firebaseapp.com",
    projectId: "talk-board-f5dca",
    storageBucket: "talk-board-f5dca.firebasestorage.app",
    messagingSenderId: "556123066323",
    appId: "1:556123066323:web:ab3a57d827df9e5ac52926"
  };

  var BOARDCODE_KEY = "talkboard.boardCode.v1";

  var EM = {
    common: ["😊","😢","😠","😴","🤕","😍","😲","🥱","👍","👎","❤️","🙏","👋","🙋","✋","➕","🛑","🏃","🥤","🍽️","⚽","👀","✅","🔁","⬆️","⬇️",
      "🍎","🍌","🥛","💧","🍪","🧀","🥣","🍕","🥨","🍞",
      "🧸","🧱","📖","🫧","🧩","🛝","📱","🚗","🌳","🎈",

  // Stable per-device id so a device can recognise (and skip) its own writes.

  /* ---------------- persistence (local, offline-first) ---------------- */

  function isValidState(s){
    return s && typeof s === "object" && Array.isArray(s.core) && Array.isArray(s.categories);
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      var parsed = JSON.parse(raw);
      // stored as {schema, data} or bare data for forward safety
      var data = parsed && parsed.data ? parsed.data : parsed;
      return isValidState(data) ? data : null;
    }catch(e){ storageOK = false; return null; }
  }

  function persist(){
    if(!storageOK) return;
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({schema:SCHEMA, savedAt:Date.now(), data:state}));
    }catch(e){ storageOK = false; renderSyncStatus(); }
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 250);
    cloudPush(false);
  }

  /* ---------------- cloud sync (optional, Firebase Firestore) ----------------
     The board is mirrored to a single Firestore document keyed by a "board
     code". Any device that enters the same code shares the board. Local
     storage stays the offline cache; the cloud doc is the shared source of
     truth. Conflict handling is last-write-wins on the whole board, which is
     fine for one caregiver editing at a time. */

  function cloudConfigured(){
    return !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
  }
  function cloudAvailable(){
    return cloudConfigured() && typeof window.firebase !== "undefined";
  }
  function cloudActive(){
    return cloud.ready && !!cloud.ref;
  }
  function setCloudStatus(s){
    if(cloud.status === s) return;
    cloud.status = s;
    renderSyncStatus();
  }

  function normalizeCode(code){
    return String(code||"").trim().toLowerCase().replace(/[^a-z0-9-]/g, "");
  }

  function generateCode(){
    var words = ["sunny","otter","maple","river","cocoa","pixel","willow","mango",
                 "pebble","comet","clover","ginger","juniper","marble","pepper","cedar"];
    function w(){ return words[Math.floor(Math.random()*words.length)]; }
    return w() + "-" + w() + "-" + Math.floor(1000 + Math.random()*9000);
  }

  function initCloud(){
    if(!cloudAvailable()) return;   // no config, or the SDK didn't load
    try{
      if(!window.firebase.apps.length) window.firebase.initializeApp(FIREBASE_CONFIG);
      cloud.db = window.firebase.firestore();
      // Offline cache: the board keeps working with no connection and queues
      // writes until it's back. Ignore failures (e.g. multiple open tabs).
      cloud.db.enablePersistence({synchronizeTabs:true}).catch(function(){});
      window.firebase.auth().onAuthStateChanged(function(user){
        if(!user) return;
        cloud.ready = true;
        var saved = null;
        try{ saved = localStorage.getItem(BOARDCODE_KEY); }catch(e){}
        if(saved && !cloud.ref) cloudJoin(saved, {silent:true});
      });
      window.firebase.auth().signInAnonymously().catch(function(){
        setCloudStatus("error");
      });
    }catch(e){
      setCloudStatus("error");
    }
  }

  function cloudJoin(code, opts){
    opts = opts || {};
    code = normalizeCode(code);
    if(!code) return;
    try{ localStorage.setItem(BOARDCODE_KEY, code); }catch(e){}
    cloud.code = code;
    if(!cloud.ready || !cloud.db){
      // Sign-in hasn't finished; onAuthStateChanged will pick up the saved code.
      setCloudStatus("connecting");
      return;
    }
    if(cloud.unsub){ cloud.unsub(); cloud.unsub = null; }
    cloud.ref = cloud.db.collection("boards").doc(code);
    setCloudStatus("connecting");
    cloud.unsub = cloud.ref.onSnapshot({includeMetadataChanges:true}, function(snap){
      // Our own not-yet-committed write echoes back first — ignore it.
      if(snap.metadata.hasPendingWrites){ setCloudStatus("connecting"); return; }
      if(!snap.exists){
        // First device on this code — seed the cloud from what's on this device.
        cloudPush(true);
        setCloudStatus(snap.metadata.fromCache ? "offline" : "synced");
        return;
      }
      var d = snap.data() || {};
      // Adopt a genuine remote change (not our own committed write).
      if(isValidState(d.data) && d.updatedBy !== CLIENT_ID){
        cloud.applyingRemote = true;
        state = d.data;
        if(activeTab !== "core" && !state.categories.some(function(c){ return c.id===activeTab; })){
          activeTab = "core";
        }
        pendingDeleteId = null;
        persist();      // keep the local offline cache in step with the cloud
        render();
        cloud.applyingRemote = false;
      }
      setCloudStatus(snap.metadata.fromCache ? "offline" : "synced");
    }, function(){
      setCloudStatus("error");
    });
    if(!opts.silent) toast("Connected to board “" + code + "”");
  }

  function cloudPush(immediate){
    if(!cloudActive() || cloud.applyingRemote) return;
    clearTimeout(cloud.pushTimer);
    var write = function(){
      if(!cloudActive()) return;
      cloud.ref.set({
        schema: SCHEMA,
        updatedBy: CLIENT_ID,
        updatedAt: window.firebase.firestore.FieldValue.serverTimestamp(),
        data: state
      }).catch(function(){ setCloudStatus("error"); });
    };
    if(immediate) write();
    else cloud.pushTimer = setTimeout(write, 400);
  }

  function cloudLeave(){
    if(cloud.unsub){ cloud.unsub(); cloud.unsub = null; }
    cloud.ref = null;
    cloud.code = null;
    try{ localStorage.removeItem(BOARDCODE_KEY); }catch(e){}
    setCloudStatus("off");
    toast("Disconnected — this device is now local only");
  }

  /* ---------------- misc helpers ---------------- */

  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.92;
      u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function typeClass(t){ return "tile-" + t; }
  function catClass(c){ return "tile-" + c; }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var toastTimer = null;

    app.toast.textContent = msg;

  /* ---------------- render ---------------- */

  function renderSyncStatus(){
    if(app.boardCodeChip){
      app.boardCodeChip.hidden = !cloud.code;
      if(cloud.code){
        app.boardCodeChip.innerHTML = '<span class="lock">🔑</span><span>' + escapeHtml(cloud.code) + '</span>';
      }

    if(cloud.code){
      var map = {
        connecting: ["",    "Syncing…"],
        synced:     ["",    "Synced across devices"],
        offline:    ["off", "Offline — will sync when online"],
        error:      ["off", "Sync problem — saved on this device"],
        off:        ["",    "Saved on this device"]
      };
      var m = map[cloud.status] || map.connecting;
      app.syncDot.className = m[0];
      app.syncText.textContent = m[1];
      return;
    }
    app.syncDot.className = storageOK ? "" : "off";
    app.syncText.textContent = storageOK
      ? "Saved on this device"
      : "Changes won't be saved on this device";

  function renderStrip(){

  function renderTabs(){

      t.addEventListener('click', function(){

        else { activeTab = cat.id; render(); }

  function currentWordList(){
    if(activeTab === 'core') return state.core;
    var cat = state.categories.find(function(c){ return c.id===activeTab; });
    return cat ? cat.words : [];
  }

  function currentCategory(){
    if(activeTab==='core') return null;
    return state.categories.find(function(c){ return c.id===activeTab; }) || null;

  function renderGrid(){
    app.grid.innerHTML = "";
    var list = currentWordList();
    var cat = currentCategory();

    list.forEach(function(word, idx){
      var tile = document.createElement('button');
      var cls = activeTab==='core' ? typeClass(word.type||'verb') : catClass((cat&&cat.color)||'cat-orange');
      tile.className = 'tile ' + cls;
      tile.innerHTML = '<span class="em">'+word.emoji+'</span><span class="word-label">'+escapeHtml(word.label)+'</span>';

      tile.addEventListener('click', function(){
        if(editMode) return; // edit handled by mini buttons
        sentence.push({label:word.label, emoji:word.emoji});

        speak(word.label);

      if(editMode){
        var moveCol = document.createElement('div');
        moveCol.className = 'moveCol';

        delBtn.addEventListener('click', function(ev){ ev.stopPropagation(); pendingDeleteId = word.id; renderGrid(); });
        row.appendChild(editBtn); row.appendChild(delBtn);

        if(pendingDeleteId === word.id){
          var conf = document.createElement('div');
          conf.className = 'confirmRow';
          conf.innerHTML = '<button class="yes">Delete</button><button class="no">Keep</button>';
          conf.querySelector('.yes').addEventListener('click', function(ev){ ev.stopPropagation(); deleteWord(word.id); });
          conf.querySelector('.no').addEventListener('click', function(ev){ ev.stopPropagation(); pendingDeleteId=null; renderGrid(); });

  /* ---------------- mutations ---------------- */

  function moveWord(idx, dir){
    var list = currentWordList();
    var j = idx + dir;
    if(j<0 || j>=list.length) return;
    var tmp = list[idx]; list[idx]=list[j]; list[j]=tmp;
    renderGrid();
    scheduleSave();
  }

  function deleteWord(id){
    var list = currentWordList();
    var i = list.findIndex(function(w){ return w.id===id; });
    if(i>-1) list.splice(i,1);
    pendingDeleteId = null;
    renderGrid();
    scheduleSave();
  }

  function upsertWord(data){
    var list = currentWordList();
    if(data.id){
      var w = list.find(function(x){ return x.id===data.id; });
      if(w){ w.label=data.label; w.emoji=data.emoji; if(activeTab==='core') w.type=data.type; }
    } else {
      var nw = {id:uid(), label:data.label, emoji:data.emoji};
      if(activeTab==='core') nw.type = data.type;
      list.push(nw);
    }
    renderGrid();
    scheduleSave();
  }

  function upsertCategory(data){
    if(data.id){
      var c = state.categories.find(function(x){ return x.id===data.id; });
      if(c){ c.name=data.name; c.emoji=data.emoji; c.color=data.color; }
    } else {
      state.categories.push({id:uid(), name:data.name, emoji:data.emoji, color:data.color, words:[]});
    }
    renderTabs();
    renderGrid();
    scheduleSave();
  }

  function deleteCategory(id){
    var i = state.categories.findIndex(function(c){ return c.id===id; });
    if(i>-1) state.categories.splice(i,1);
    if(activeTab===id) activeTab='core';
    render();
    scheduleSave();
  }

    if(afterMount) afterMount();

  function buildEmojiPicker(container, onPick){
    var wrap = document.createElement('div');
    wrap.className = 'emojiPicker';
    EM.common.forEach(function(em){
      var b = document.createElement('button');
      b.type='button'; b.textContent = em;
      b.addEventListener('click', function(){ onPick(em); });
      wrap.appendChild(b);
    });
    container.appendChild(wrap);
  }

  function openWordModal(wordId){
    var isCore = activeTab === 'core';
    var list = currentWordList();
    var existing = wordId ? list.find(function(w){ return w.id===wordId; }) : null;

    var typeOptions = "";
    if(isCore){
      typeOptions = CORE_TYPES.map(function(t){
        var sel = existing && existing.type===t.v ? 'selected' : '';
        return '<option value="'+t.v+'" '+sel+'>'+t.l+'</option>';
      }).join('');
    }

    var html =
      '<h2>'+(existing?'Edit word':'Add a word')+'</h2>' +
      (isCore ? '<div class="tip">Tip: once your child learns where a core word is, try to keep it in the same spot — that consistency helps them find words faster over time.</div>' : '') +
      '<div class="field"><label>Word</label><input type="text" id="fLabel" value="'+(existing?escapeHtml(existing.label):'')+'" placeholder="e.g. more"></div>' +
      '<div class="field"><label>Symbol</label><input type="text" id="fEmoji" value="'+(existing?existing.emoji:'')+'" placeholder="Tap an emoji below, or use your keyboard"><div id="pickerHost"></div></div>' +
      (isCore ? '<div class="field"><label>Word type</label><select id="fType">'+typeOptions+'</select></div>' : '') +
      '<div class="sheetActions">' +
        '<button class="btn btnGhost" id="fCancel">Cancel</button>' +
        '<button class="btn btnPrimary" id="fSave">Save</button>' +
      '</div>';

    openModal(html, function(){
      var pickerHost = document.getElementById('pickerHost');
      buildEmojiPicker(pickerHost, function(em){ document.getElementById('fEmoji').value = em; });
      document.getElementById('fCancel').addEventListener('click', closeModal);
      document.getElementById('fSave').addEventListener('click', function(){
        var label = document.getElementById('fLabel').value.trim();
        var emoji = document.getElementById('fEmoji').value.trim() || '⭐';
        if(!label) return;
        var data = {id: existing?existing.id:null, label:label, emoji:emoji};
        if(isCore) data.type = document.getElementById('fType').value;
        upsertWord(data);
        closeModal();
      });
    });
  }

  function openCategoryModal(catId){
    var existing = catId ? state.categories.find(function(c){ return c.id===catId; }) : null;
    var colorSwatches = CAT_COLORS.map(function(c){
      return '<button type="button" class="colorSwatch '+((existing&&existing.color===c)||(!existing&&c===CAT_COLORS[0])?'selected':'')+'" data-color="'+c+'" style="background:var(--'+c+'-bg)"></button>';
    }).join('');

    var html =
      '<h2>'+(existing?'Edit category':'New category')+'</h2>' +
      '<div class="field"><label>Name</label><input type="text" id="fName" value="'+(existing?escapeHtml(existing.name):'')+'" placeholder="e.g. Feelings"></div>' +
      '<div class="field"><label>Icon</label><input type="text" id="fCEmoji" value="'+(existing?existing.emoji:'📁')+'"><div id="cPickerHost"></div></div>' +
      '<div class="field"><label>Color</label><div class="colorPicker">'+colorSwatches+'</div></div>' +
      '<div class="sheetActions">' +
        '<button class="btn btnGhost" id="cCancel">Cancel</button>' +
        '<button class="btn btnPrimary" id="cSave">Save</button>' +
      '</div>' +
      (existing ? '<button class="btn" id="cDelete" style="width:100%;margin-top:10px;background:transparent;color:var(--danger);">Delete this category</button>' : '');

    openModal(html, function(){
      var chosenColor = existing ? existing.color : CAT_COLORS[0];
      document.querySelectorAll('.colorSwatch').forEach(function(sw){
        sw.addEventListener('click', function(){
          document.querySelectorAll('.colorSwatch').forEach(function(s){ s.classList.remove('selected'); });
          sw.classList.add('selected');
          chosenColor = sw.getAttribute('data-color');
        });
      });
      var pickerHost = document.getElementById('cPickerHost');
      buildEmojiPicker(pickerHost, function(em){ document.getElementById('fCEmoji').value = em; });
      document.getElementById('cCancel').addEventListener('click', closeModal);
      document.getElementById('cSave').addEventListener('click', function(){
        var name = document.getElementById('fName').value.trim();
        var emoji = document.getElementById('fCEmoji').value.trim() || '📁';
        if(!name) return;
        upsertCategory({id: existing?existing.id:null, name:name, emoji:emoji, color:chosenColor});
        closeModal();
      });
      var delBtn = document.getElementById('cDelete');
      if(delBtn){
        delBtn.addEventListener('click', function(){
          deleteCategory(existing.id);
          closeModal();
        });
      }
    });
  }

  /* ---------------- cloud sync modal ---------------- */

  function openCloudModal(){
    var html;
    if(!cloudConfigured()){
      html =
        '<h2>Cloud sync</h2>' +
        '<div class="tip">Cloud sync isn’t set up yet. Add your Firebase settings near the top of <code>index.html</code> (the <code>FIREBASE_CONFIG</code> block) to sync this board across devices — see the README for the 5-minute setup.</div>' +
        '<div class="sheetActions"><button class="btn btnPrimary" id="clClose">Close</button></div>';
    } else if(cloudActive()){
      html =
        '<h2>Cloud sync</h2>' +
        '<div class="tip">This board is syncing under the code below. Enter the same code on another device to share it. The code is locked while connected — to switch boards, create a new code. Anyone who knows the code can view and edit, so treat it like a password.</div>' +
        '<div class="field"><label>Board code (locked)</label><input type="text" id="clCode" value="' + escapeHtml(cloud.code) + '" readonly></div>' +
        '<div class="sheetActions">' +
          '<button class="btn btnGhost" id="clCopy">Copy code</button>' +
          '<button class="btn btnPrimary" id="clClose">Done</button>' +
        '</div>' +
        '<button class="btn btnGhost" id="clNew" style="width:100%;margin-top:12px;">Create a new board code</button>' +
        '<button class="btn" id="clLeave" style="width:100%;margin-top:8px;background:transparent;color:var(--danger);">Turn off sync (this device only)</button>';
    } else {
      html =
        '<h2>Cloud sync</h2>' +
        '<div class="tip">Enter a board code to sync this board across devices, or generate a new one. Anyone who knows the code can view and edit — treat it like a password.</div>' +
        '<div class="field"><label>Board code</label><input type="text" id="clCode" placeholder="e.g. sunny-otter-1234" autocapitalize="none" autocomplete="off" spellcheck="false"></div>' +
        '<button class="btn btnGhost" id="clGen" style="width:100%;">Generate a code</button>' +
        '<div class="sheetActions" style="margin-top:10px;">' +
          '<button class="btn btnGhost" id="clClose">Cancel</button>' +
          '<button class="btn btnPrimary" id="clConnect">Connect</button>' +
        '</div>';
    }
    openModal(html, function(){
      var byId = function(id){ return document.getElementById(id); };
      var close = byId('clClose'); if(close) close.addEventListener('click', closeModal);
      var gen = byId('clGen'); if(gen) gen.addEventListener('click', function(){ byId('clCode').value = generateCode(); });
      var connect = byId('clConnect');
      if(connect) connect.addEventListener('click', function(){
        var code = normalizeCode(byId('clCode').value);
        if(!code){ toast("Enter or generate a code first"); return; }
        cloudJoin(code);
        closeModal();
      });
      var copy = byId('clCopy');
      if(copy) copy.addEventListener('click', function(){
        var t = cloud.code || "";
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(t).then(function(){ toast("Code copied"); }, function(){ toast("Code: " + t); });
        } else { toast("Code: " + t); }
      });
      var makeNew = byId('clNew');
      if(makeNew) makeNew.addEventListener('click', function(){
        if(!window.confirm("Create a new board code? This device moves to a brand-new code (your current words come with it). Other devices stay on the old code until you enter the new one on them.")) return;
        cloudJoin(generateCode());
        closeModal();
      });
      var leave = byId('clLeave');
      if(leave) leave.addEventListener('click', function(){ cloudLeave(); closeModal(); });
    });
  }

  /* ---------------- backup / restore ---------------- */

  function backupBoard(){
    try{
      var payload = {app:"talk-board", schema:SCHEMA, exportedAt:new Date().toISOString(), data:state};
      var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var stamp = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = "talk-board-backup-" + stamp + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      toast("Backup saved to your files");
    }catch(e){
      toast("Couldn't create a backup");
    }
  }

  function restoreBoard(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        var data = parsed && parsed.data ? parsed.data : parsed;
        if(!isValidState(data)) throw new Error("bad");
        state = data;
        activeTab = "core";
        pendingDeleteId = null;
        persist();
        cloudPush(true);   // if synced, share the restored board with other devices
        render();
        toast("Board restored");
      }catch(e){
        toast("That file isn't a Talk Board backup");
      }
    };
    reader.onerror = function(){ toast("Couldn't read that file"); };
    reader.readAsText(file);
  }

  /* ---------------- lock / unlock ---------------- */

  var holdRaf = null, holdStart = null;
  var HOLD_MS = 1000;

  function startHold(){
    holdStart = performance.now();
    cancelAnimationFrame(holdRaf);
    step();
    function step(){
      var elapsed = performance.now() - holdStart;
      var pct = Math.min(1, elapsed/HOLD_MS);
      var circumference = 226;
      app.unlockFill.style.strokeDashoffset = String(circumference * (1-pct));
      if(pct>=1){
        editMode = true;
        app.unlockRoot.classList.remove('show');
        app.unlockFill.style.strokeDashoffset = '226';
        render();
        return;
      }
      holdRaf = requestAnimationFrame(step);
    }
  }
  function cancelHold(){
    cancelAnimationFrame(holdRaf);
    app.unlockFill.style.strokeDashoffset = '226';
  }

  app.gearBtn.addEventListener('click', function(){
    app.unlockRoot.classList.add('show');
  });
  document.getElementById('unlockCancel').addEventListener('click', function(){
    cancelHold();
    app.unlockRoot.classList.remove('show');
  });
  app.unlockRoot.addEventListener('click', function(e){
    if(e.target === app.unlockRoot){
      cancelHold();
      app.unlockRoot.classList.remove('show');
    }
  });
  var holdBtn = document.getElementById('unlockHold');
  holdBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); startHold(); });
  ['pointerup','pointerleave','pointercancel'].forEach(function(evt){ holdBtn.addEventListener(evt, cancelHold); });

  app.exitPill.addEventListener('click', function(){
    editMode = false;
    pendingDeleteId = null;
    render();
  });

  document.getElementById('modalBackdrop').addEventListener('click', closeModal);

  /* ---------------- top-level controls ---------------- */

  document.getElementById('clearBtn').addEventListener('click', function(){
    sentence = [];
    renderStrip();
  });
  document.getElementById('speakBtn').addEventListener('click', function(){
    if(sentence.length===0) return;
    speak(sentence.map(function(w){ return w.label; }).join(' '));
  });

  document.getElementById('cloudBtn').addEventListener('click', openCloudModal);
  app.boardCodeChip.addEventListener('click', function(){
    var t = cloud.code || "";
    if(!t) return;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ toast("Board code copied"); }, function(){ toast("Board code: " + t); });
    } else { toast("Board code: " + t); }
  });
  document.getElementById('backupBtn').addEventListener('click', backupBoard);
  var restoreFile = document.getElementById('restoreFile');
  document.getElementById('restoreBtn').addEventListener('click', function(){ restoreFile.click(); });
  restoreFile.addEventListener('change', function(){
    if(restoreFile.files && restoreFile.files[0]) restoreBoard(restoreFile.files[0]);
    restoreFile.value = "";
  });

  /* ---------------- install (PWA) ---------------- */

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    if(!editMode) app.installBtn.style.display = 'flex';
  });
  app.installBtn.addEventListener('click', function(){
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(function(){
      deferredInstallPrompt = null;
      app.installBtn.style.display = 'none';
    });
  });
  window.addEventListener('appinstalled', function(){
    deferredInstallPrompt = null;
    app.installBtn.style.display = 'none';
  });

  /* ---------------- boot ---------------- */

  var loaded = loadState();
  if(loaded){ state = loaded; }
  else { persist(); } // seed on first run

  render();

  // service worker for offline use
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  // Cloud sync boots after `load`, by which point the deferred Firebase SDK
  // has run. If it's not configured or didn't load, the app stays local-only.
  window.addEventListener('load', function(){
    try{ initCloud(); }catch(e){}
  });

})();
</script>
